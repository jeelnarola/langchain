[project]
name = "langchain-app"
version = "0.1.0"
description = "LangChain application with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "langchain==0.3.27",
    "langchain-chroma==0.2.5",
    "langchain-community==0.3.27",
    "langchain-core==0.3.74",
    "langchain-openai==0.3.32",
    "langchain-text-splitters==0.3.9",
    "chromadb==1.0.17",
    "openai>=1.99.9,<2.0.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.42",
    "mysql-connector-python==9.4.0",
    "pymysql==1.1.1",
    "aiomysql==0.2.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "bcrypt==4.3.0",
    "yagmail==0.15.293",
    "pdf2image==1.17.0",
    "pdfplumber==0.11.7",
    "pytesseract==0.3.13",
    "pymupdf==1.26.3",
    "faiss-cpu==1.11.0.post1",
    "numpy==2.3.2",
    "pillow==11.3.0",
    "requests==2.32.4",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "tiktoken==0.10.0",
    "jinja2==3.1.6",
    "mcp>=1.21.0",
    "google-genai>=1.49.0",
]

[project.scripts]
start = "src.main:main"

[tool.uv.sources]
src = { path = "src", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
